[package]
name = "dwgpdf"
version = "0.1.0"
edition = "2021"
authors = ["Ducflair"]
description = "High-performance CAD (DXF, DWG, DWF) to PDF converter in Rust using hipdf"
license = "MIT"

[lib]
name = "dwgpdf"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dwgpdf"
path = "src/main.rs"

[dependencies]
hipdf = "1.3.8"
acadrust = "0.5.5"
dxf = "0.6.1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
clap = { version = "4.5", features = ["derive"], optional = true }

[features]
default = ["cli"]
cli = ["dep:clap"]
